name: Play Store

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to Play (off = only build the AAB as an artifact, e.g. for the first manual upload)"
        type: boolean
        default: true
      status:
        description: "Release status (use draft while the app itself is still a draft in Play Console)"
        type: choice
        options: [completed, draft]
        default: completed
      version_code_offset:
        description: "Added to the time-based versionCode (only needed if Play reports a used versionCode)"
        type: number
        default: 0
  push:
    tags: ["android-v*"]
  # Production releases (release.yml): same build, uploaded to the production track as a staged rollout.
  workflow_call:
    inputs:
      track:
        type: string
        default: internal
      user_fraction:
        description: "Staged rollout share, e.g. 0.2 (empty = full release)"
        type: string
        default: ""
      version_name:
        type: string
        default: ""
      version_code:
        type: string
        default: ""
      release_notes:
        description: "What's New text (Play allows 500 characters per language)"
        type: string
        default: ""

concurrency:
  group: play-store
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  play-store:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PACKAGE_NAME: dev.mothlight.plantagotchi
      # Tag pushes have no inputs, so fall back to the defaults.
      UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}
      TRACK: ${{ inputs.track || 'internal' }}
      USER_FRACTION: ${{ inputs.user_fraction }}
      # A staged rollout has to be "inProgress"; otherwise the chosen status (default completed).
      RELEASE_STATUS: ${{ inputs.user_fraction != '' && 'inProgress' || inputs.status || 'completed' }}
      versionName: ${{ inputs.version_name }}
      # Cloud save (optional): repository variables, the publishable key is meant to ship in apps.
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute versionCode
        env:
          INPUT_CODE: ${{ inputs.version_code }}
          OFFSET: ${{ inputs.version_code_offset || 0 }}
        run: |
          case "$OFFSET" in ''|*[!0-9]*) echo "::error::version_code_offset must be a non-negative integer"; exit 1 ;; esac
          code="${INPUT_CODE:-$(.github/scripts/build-number.sh)}"
          echo "versionCode=$((code + OFFSET))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing (see docs/play-store.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build release bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:bundleRelease --no-configuration-cache

      - name: Keep AAB
        uses: actions/upload-artifact@v7
        with:
          name: android-release-${{ env.versionCode }}
          path: androidApp/build/outputs/bundle/release/androidApp-release.aab
          retention-days: 30

      - name: What's New
        env:
          NOTES: ${{ inputs.release_notes }}
        run: |
          dir="$RUNNER_TEMP/whatsnew"
          mkdir -p "$dir"
          notes="${NOTES:-Verbesserungen und Fehlerbehebungen}"
          for locale in de-DE en-US; do printf '%s\n' "${notes:0:500}" > "$dir/whatsnew-$locale"; done
          echo "WHATSNEW_DIR=$dir" >> "$GITHUB_ENV"

      - name: Upload to Play (${{ env.TRACK }})
        if: env.UPLOAD == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: androidApp/build/outputs/bundle/release/androidApp-release.aab
          track: ${{ env.TRACK }}
          status: ${{ env.RELEASE_STATUS }}
          userFraction: ${{ env.USER_FRACTION }}
          whatsNewDirectory: ${{ env.WHATSNEW_DIR }}

      - name: Summary
        run: |
          {
            echo "### Android release"
            echo "- versionCode: \`$versionCode\`"
            echo "- Cloud save: ${SUPABASE_URL:+on}${SUPABASE_URL:-off (set the SUPABASE_URL variable)}"
            if [ "$UPLOAD" = "true" ]; then
              echo "- Uploaded to the **$TRACK** track (status: \`$RELEASE_STATUS\`${USER_FRACTION:+, rollout $USER_FRACTION})"
            else
              echo "- Not uploaded: download the AAB from the run artifacts"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
