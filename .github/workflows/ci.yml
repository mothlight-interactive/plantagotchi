name: CI

on:
  pull_request:
  push:
    branches: [master]
  # Called by release.yml so a production release only ships a commit that builds.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The release APK (unsigned here) runs R8, so missing keep rules fail the PR, not the release.
      # The iOS klibs cross-compile on Linux (no linking), which type-checks the iOS code.
      - name: Build Android APKs and compile iOS code
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease :shared:compileKotlinIosSimulatorArm64 --no-configuration-cache

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # commonTest runs on the JVM twice: as Android host tests and on the desktop JVM target.
      # desktopTest also runs the Compose UI smoke tests (shared/src/desktopTest), rendered
      # offscreen with Skia, so the runner needs no display.
      - name: Run unit and UI tests
        run: ./gradlew :shared:testAndroidHostTest :shared:desktopTest --no-configuration-cache

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: shared/build/reports/tests/
