name: Release notes

# When a GitHub release for a v* tag is published, fill its description with the changes since
# the previous v* tag (GitHub's generated notes: merged PRs and contributors). Text the author
# wrote above the marker is kept; the generated part below it is replaced on every run.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  notes:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update release description
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          marker="<!-- changes:auto -->"
          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null || true)"
          args=(-f tag_name="$TAG")
          [ -n "$prev" ] && args+=(-f previous_tag_name="$prev")
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body > generated.md

          gh release view "$TAG" --json body --jq .body > current.md
          # Keep what the author wrote before the marker, regenerate everything after it.
          awk -v m="$marker" '$0 == m { exit } { print }' current.md > body.md
          {
            [ -s body.md ] && echo
            echo "$marker"
            echo "## Changes${prev:+ since $prev}"
            echo
            cat generated.md
          } >> body.md
          gh release edit "$TAG" --notes-file body.md
          echo "Updated the notes of $TAG${prev:+ (changes since $prev)}" >> "$GITHUB_STEP_SUMMARY"
